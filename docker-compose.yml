services:
  app-backend:
    image: ghcr.io/djkix/magazine-search-backend:latest
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    volumes:
      - app_data:/data
      - ${NAS_MOUNT_PATH}:/mnt/nas:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - postgres
      - redis
      - meilisearch
    networks:
      - internal

  worker:
    image: ghcr.io/djkix/magazine-search-backend:latest
    restart: unless-stopped
    command: rq worker --url redis://${REDIS_HOST}:${REDIS_PORT} ingestion
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    volumes:
      - app_data:/data
      - ${NAS_MOUNT_PATH}:/mnt/nas:ro
    depends_on:
      - postgres
      - redis
      - meilisearch
    networks:
      - internal

  app-frontend:
    image: ghcr.io/djkix/magazine-search-frontend:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - app-backend
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  meili_data:
  redis_data:
  app_data:
