services:
  app-backend:
    image: ghcr.io/djkix/magazine-search-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # NOTE sécurité : --forwarded-allow-ips="*" fait confiance à l'en-tête
    # X-Forwarded-For de n'importe quel client, ce qui permet de réinitialiser
    # le compteur anti-force-brute du login à volonté. Le port n'étant plus
    # publié sur l'hôte (voir « expose » ci-dessous), seul un client déjà
    # présent sur le réseau Docker interne peut en profiter. Pour fermer
    # complètement : remplacer "*" par l'adresse du conteneur app-frontend,
    # seul client légitime du backend. À valider sur la stack en marche.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # NAS_MOUNT_PATH in .env is the HOST path used above to source the
      # volume mount; env_file also injects that same var into the
      # container, where the app would otherwise read it and override its
      # own /mnt/nas default with a path that doesn't exist in here. Pin it
      # back to the container-side mount point.
      NAS_MOUNT_PATH: /mnt/nas
    volumes:
      - app_data:/data
      - ${NAS_MOUNT_PATH}:/mnt/nas:ro
    # Le backend n'est PLUS publié sur l'hôte : il n'est joignable que depuis
    # le réseau Docker interne, via app-frontend qui relaie /api/*. Le reverse
    # proxy n'a besoin que du port du frontend. Pour un accès de débogage
    # ponctuel : docker compose exec app-backend ... ou rétablir « ports »
    # temporairement en local.
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - internal

  worker:
    image: ghcr.io/djkix/magazine-search-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: python -m app.worker.run
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # NAS_MOUNT_PATH in .env is the HOST path used above to source the
      # volume mount; env_file also injects that same var into the
      # container, where the app would otherwise read it and override its
      # own /mnt/nas default with a path that doesn't exist in here. Pin it
      # back to the container-side mount point.
      NAS_MOUNT_PATH: /mnt/nas
    volumes:
      - app_data:/data
      - ${NAS_MOUNT_PATH}:/mnt/nas:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - internal

  app-frontend:
    image: ghcr.io/djkix/magazine-search-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Pas de « env_file: .env » ici : cela injectait TOUS les secrets du
    # backend (JWT_SECRET_KEY, POSTGRES_PASSWORD, MEILI_MASTER_KEY,
    # GEMINI_API_KEY) dans le conteneur Next.js, qui n'en a aucun besoin.
    # Seules les quatre variables réellement lues par le frontend sont
    # transmises.
    environment:
      TZ: ${TZ:-Europe/Paris}
      BACKEND_INTERNAL_URL: http://app-backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - app-backend
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  # Sauvegarde périodique de Postgres avec rotation. La base est la seule
  # donnée non reconstructible de la stack : les PDF du NAS peuvent être
  # re-scannés, mais pas le texte OCR ni les sommaires payés à l'API Gemini.
  # Vérifier régulièrement qu'une restauration fonctionne :
  #   gunzip -c backups/<fichier>.sql.gz | docker compose exec -T postgres \
  #     psql -U "$POSTGRES_USER" -d <base_de_test>
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./ops/pg_backup.sh:/usr/local/bin/pg_backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/pg_backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  meili_data:
  redis_data:
  app_data:
