services:
  app-backend:
    image: ghcr.io/djkix/magazine-search-backend:latest
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # NAS_MOUNT_PATH in .env is the HOST path used above to source the
      # volume mount; env_file also injects that same var into the
      # container, where the app would otherwise read it and override its
      # own /mnt/nas default with a path that doesn't exist in here. Pin it
      # back to the container-side mount point.
      NAS_MOUNT_PATH: /mnt/nas
    volumes:
      - app_data:/data
      - ${NAS_MOUNT_PATH}:/mnt/nas:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - internal

  worker:
    image: ghcr.io/djkix/magazine-search-backend:latest
    restart: unless-stopped
    command: python -m app.worker.run
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # NAS_MOUNT_PATH in .env is the HOST path used above to source the
      # volume mount; env_file also injects that same var into the
      # container, where the app would otherwise read it and override its
      # own /mnt/nas default with a path that doesn't exist in here. Pin it
      # back to the container-side mount point.
      NAS_MOUNT_PATH: /mnt/nas
    volumes:
      - app_data:/data
      - ${NAS_MOUNT_PATH}:/mnt/nas:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - internal

  app-frontend:
    image: ghcr.io/djkix/magazine-search-frontend:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - app-backend
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  meili_data:
  redis_data:
  app_data:
