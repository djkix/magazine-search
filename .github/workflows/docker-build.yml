name: Build and publish images

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  workflow_call:
    inputs:
      tag:
        description: "Version tag to build and publish (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # A release-please merge triggers this workflow twice for the same
      # commit (this push:branches trigger, and release-please.yml's
      # workflow_call with the version tag). Serialize per image so they
      # never race on the same GHA cache scope.
      group: docker-build-${{ matrix.image }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - image: backend
            context: ./backend
            build_args: ""
          - image: frontend
            context: ./frontend
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/api' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG_NAME="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME=""
          fi
          VERSION="${TAG_NAME#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          # Non-release builds (plain push to main) have no version tag. Show
          # the last actual release number (from the changelog) instead of a
          # commit-specific "dev-<sha>" placeholder, so the UI always
          # reflects a real, meaningful version.
          if [ -n "$VERSION" ]; then
            echo "display=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "display=$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ steps.version.outputs.value != '' }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.build_args }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.display }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
