name: CI

on:
  push:
    branches: [main]
  # Les PR ouvertes par release-please ne touchent que ces deux fichiers :
  # les ignorer évite que CI se déclenche dessus, et donc le blocage
  # "Action required" que GitHub impose à ce bot avant de lancer un
  # workflow sur sa pull request.
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"
      - ".release-please-manifest.json"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Le workflow ne faisait que du scan de secrets et du build d'images :
  # aucune erreur de type ni de syntaxe n'était détectée avant déploiement.
  typecheck-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: TypeScript typecheck
        working-directory: ./frontend
        run: npm run typecheck

  lint-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.6.9
      # Jeu de règles volontairement restreint aux erreurs réelles : erreurs de
      # syntaxe (E9), noms non définis (F821), imports/variables cassés (F82),
      # comparaisons douteuses (F63), f-strings sans champ (F541). Le code
      # n'ayant jamais été passé à un linter, activer tout ruff d'un coup
      # rendrait la CI rouge sur du style. À élargir progressivement.
      - name: Ruff (erreurs réelles)
        working-directory: ./backend
        run: ruff check --select=E9,F63,F7,F82,F541 --output-format=concise .

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements-dev.txt
      # Les tests actuels sont du calcul pur : ni PostgreSQL, ni Redis, ni
      # Meilisearch, ni fichier PDF. Les secrets attendus par Settings sont
      # posés par tests/conftest.py.
      - name: pytest
        working-directory: ./backend
        run: pytest

  migrations:
    # Rejoue toute la chaîne Alembic sur une base vierge, la déroule, puis la
    # rejoue. Les tests unitaires n'ouvrent aucune base : une migration fautive
    # passait donc la CI sans encombre.
    #
    # Cas réel, 11/09/2026 : la migration 0012 recréait « ix_magazines_collection_id »,
    # déjà posé par 0005. En production, alembic échouait au démarrage, le
    # conteneur sortait en erreur et Docker le relançait — boucle infinie,
    # application indisponible deux heures. Ce job l'aurait signalé en quelques
    # secondes, avant tout déploiement.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Même version qu'en production : une différence de version peut
        # accepter ici ce que le serveur refusera là-bas.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: magazines
          POSTGRES_PASSWORD: magazines
          POSTGRES_DB: magazines
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U magazines"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://magazines:magazines@localhost:5432/magazines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      # Les secrets exigés par Settings sont générés à la volée : un littéral
      # ressemblant à une clé déclencherait gitleaks, en pre-commit comme en CI.
      - name: Prepare environment
        run: |
          echo "JWT_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MEILI_MASTER_KEY=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "LOG_DIR=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Upgrade to head on an empty database
        working-directory: ./backend
        run: alembic upgrade head

      # Déroule toute la chaîne. Un downgrade() qui supprime un objet
      # appartenant à une révision antérieure échoue ici : la révision
      # propriétaire tente ensuite de le supprimer à son tour et ne le trouve
      # plus. C'est exactement le second défaut de 0012, resté invisible
      # jusqu'à ce qu'on le cherche à la main.
      - name: Downgrade back to base
        working-directory: ./backend
        run: alembic downgrade base

      # La chaîne doit être rejouable : sans cela, un downgrade incomplet
      # laisse une base impossible à remonter.
      - name: Upgrade to head again
        working-directory: ./backend
        run: alembic upgrade head

  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: |
            type=gha,scope=ci-backend
            type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=ci-backend

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          cache-from: |
            type=gha,scope=ci-frontend
            type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=ci-frontend
