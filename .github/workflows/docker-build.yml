name: Build and publish images

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  workflow_call:
    inputs:
      tag:
        description: "Version tag to build and publish (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      # A release-please merge triggers this workflow twice for the same
      # commit (this push:branches trigger, and release-please.yml's
      # workflow_call with the version tag). Serialize per image so they
      # never race on the same GHA cache scope.
      group: docker-build-${{ matrix.image }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - image: backend
            context: ./backend
            build_args: ""
          - image: frontend
            context: ./frontend
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/api' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        # Valeurs passées par l'environnement, jamais interpolées dans le
        # script : un nom de tag contenant du shell ne peut pas s'exécuter.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG_NAME="$REF_NAME"
          else
            TAG_NAME=""
          fi
          VERSION="${TAG_NAME#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          # Non-release builds (plain push to main) have no version tag. Show
          # the last actual release number (from the changelog) instead of a
          # commit-specific "dev-<sha>" placeholder, so the UI always
          # reflects a real, meaningful version.
          if [ -n "$VERSION" ]; then
            echo "display=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "display=$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ steps.version.outputs.value != '' }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.build_args }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.display }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
