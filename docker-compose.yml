services:
  app-backend:
    image: ghcr.io/djkix/magazine-search-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # NOTE sécurité : --forwarded-allow-ips="*" fait confiance à l'en-tête
    # X-Forwarded-For de n'importe quel client, ce qui permet de réinitialiser
    # le compteur anti-force-brute du login à volonté. Le port n'étant plus
    # publié sur l'hôte (voir « expose » ci-dessous), seul un client déjà
    # présent sur le réseau Docker interne peut en profiter. Pour fermer
    # complètement : remplacer "*" par l'adresse du conteneur app-frontend,
    # seul client légitime du backend. À valider sur la stack en marche.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # NAS_MOUNT_PATH in .env is the HOST path used above to source the
      # volume mount; env_file also injects that same var into the
      # container, where the app would otherwise read it and override its
      # own /mnt/nas default with a path that doesn't exist in here. Pin it
      # back to the container-side mount point.
      NAS_MOUNT_PATH: /mnt/nas
    volumes:
      - app_data:/data
      - ${NAS_MOUNT_PATH}:/mnt/nas:ro
    # Le backend n'est PLUS publié sur l'hôte : il n'est joignable que depuis
    # le réseau Docker interne, via app-frontend qui relaie /api/*. Le reverse
    # proxy n'a besoin que du port du frontend. Pour un accès de débogage
    # ponctuel : docker compose exec app-backend ... ou rétablir « ports »
    # temporairement en local.
    expose:
      - "8000"
    # Sain une fois les migrations Alembic jouées et uvicorn à l'écoute :
    # entrypoint.sh ne lance uvicorn qu'après « alembic upgrade head ». Le
    # délai de démarrage est large, une migration pouvant durer plusieurs
    # minutes sur une grosse base.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - internal

  worker:
    image: ghcr.io/djkix/magazine-search-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: python -m app.worker.run
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # NAS_MOUNT_PATH in .env is the HOST path used above to source the
      # volume mount; env_file also injects that same var into the
      # container, where the app would otherwise read it and override its
      # own /mnt/nas default with a path that doesn't exist in here. Pin it
      # back to the container-side mount point.
      NAS_MOUNT_PATH: /mnt/nas
    volumes:
      - app_data:/data
      - ${NAS_MOUNT_PATH}:/mnt/nas:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - internal

  app-frontend:
    image: ghcr.io/djkix/magazine-search-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Pas de « env_file: .env » ici : cela injectait TOUS les secrets du
    # backend (JWT_SECRET_KEY, POSTGRES_PASSWORD, MEILI_MASTER_KEY) dans le
    # conteneur Next.js, qui n'en a aucun besoin. Seules les quatre variables
    # réellement lues par le frontend sont transmises.
    environment:
      TZ: ${TZ:-Europe/Paris}
      BACKEND_INTERNAL_URL: http://app-backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - app-backend
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - internal

  # Sauvegarde vers le NAS, en NFS : chaque jour dès 3 h (heure de Paris), la
  # base, les données de l'application (volume app_data : PDF retraités par
  # l'OCR et couvertures, sans les journaux) et la configuration de la stack,
  # dans un dossier daté, sept jours gardés, sans chiffrement (voir
  # sauvegarde/). Les PDF d'origine sont déjà sur le NAS et ne sont pas
  # copiés ; l'index Meilisearch se reconstruit depuis la base, Redis ne porte
  # qu'une file de travail.
  #
  # Ne pas confondre : NAS_MOUNT_PATH est la bibliothèque de PDF, montée en
  # lecture seule dans app-backend et worker sur /mnt/nas ; NAS_OPTIONS et
  # NAS_CHEMIN décrivent le dossier de sauvegarde, monté ici seul sur /nas.
  #
  # Activé par le profil « sauvegarde » : COMPOSE_PROFILES=sauvegarde dans le
  # .env. Sans lui, ni ce service ni le volume nas ne sont créés, et une
  # installation sans NAS de sauvegarde démarre comme avant.
  #
  # Le code est dans l'image : la stack reste autonome. Aucun service n'en
  # dépend : NAS éteint, seul ce conteneur ne démarre pas, et le tableau de
  # bord d'administration le signale au bout de 36 h.
  sauvegarde:
    image: ghcr.io/djkix/magazine-search-sauvegarde:${IMAGE_TAG:-latest}
    profiles: [sauvegarde]
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      HEURE: ${SAUVEGARDE_HEURE:-3}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # Une base injoignable ne bloque pas la boucle de planification : 10 s pour se connecter.
      PGCONNECT_TIMEOUT: "10"
    volumes:
      - app_data:/data:ro
      # Le dossier de la stack : son fichier compose et son .env sont copiés.
      - .:/stack:ro
      - nas:/nas
    # Le backend sain a joué les migrations : les tables backup_runs et
    # backup_requests existent avant la première tentative.
    depends_on:
      app-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  meili_data:
  redis_data:
  app_data:
  # Dossier de sauvegarde sur le NAS, en NFS ; adresse et chemin dans le .env,
  # jamais dans le dépôt. Créé seulement avec le profil « sauvegarde » ; sans
  # « :? » pour qu'une installation sans ce profil n'ait rien à renseigner.
  nas:
    driver: local
    driver_opts:
      type: ${NAS_TYPE:-nfs}
      o: ${NAS_OPTIONS:-}
      device: ${NAS_CHEMIN:-}
