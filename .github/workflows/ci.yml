name: CI

on:
  push:
    branches: [main]
  # Les PR ouvertes par release-please ne touchent que ces deux fichiers :
  # les ignorer évite que CI se déclenche dessus, et donc le blocage
  # "Action required" que GitHub impose à ce bot avant de lancer un
  # workflow sur sa pull request.
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"
      - ".release-please-manifest.json"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Le workflow ne faisait que du scan de secrets et du build d'images :
  # aucune erreur de type ni de syntaxe n'était détectée avant déploiement.
  typecheck-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: TypeScript typecheck
        working-directory: ./frontend
        run: npm run typecheck

  lint-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.6.9
      # Jeu de règles volontairement restreint aux erreurs réelles : erreurs de
      # syntaxe (E9), noms non définis (F821), imports/variables cassés (F82),
      # comparaisons douteuses (F63), f-strings sans champ (F541). Le code
      # n'ayant jamais été passé à un linter, activer tout ruff d'un coup
      # rendrait la CI rouge sur du style. À élargir progressivement.
      - name: Ruff (erreurs réelles)
        working-directory: ./backend
        run: ruff check --select=E9,F63,F7,F82,F541 --output-format=concise .

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements-dev.txt
      # Les tests actuels sont du calcul pur : ni PostgreSQL, ni Redis, ni
      # Meilisearch, ni fichier PDF. Les secrets attendus par Settings sont
      # posés par tests/conftest.py.
      - name: pytest
        working-directory: ./backend
        run: pytest

  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: |
            type=gha,scope=ci-backend
            type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=ci-backend

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          cache-from: |
            type=gha,scope=ci-frontend
            type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=ci-frontend
